environment:
  seed: 42
  num_parallel_envs: 4
  max_episode_steps: 400
  dt: 0.05
  world_bounds_meters: [10000, 10000, 3000]
  num_defended_hvas: 2
  max_neighbors_observed: 15
  max_allies_observed: 10
  interceptor_expended_on_intercept: false
  expire_margin_m: 1000.0

entities:
  drones:
    num_interceptors: 16
    num_scouts: 4
    max_speed: 350.0
    max_accel_g: 12.0
    scout_speed_fraction: 0.6
    scout_accel_fraction: 0.6
    linear_drag: 0.015
    collision_radius: 5.0
    cbf_safe_radius: 40.0
    intercept_radius: 25.0
    interceptor_sensor_range: 4500.0
    scout_sensor_range: 9000.0
  missiles:
    num_missiles: 30
    decoy_fraction: 0.15
    max_speed: 450.0
    max_accel_g: 8.0
    linear_drag: 0.0
    weave_amplitude_g: 4.0
    weave_frequency_rad_s: 1.5
    max_salvo_owners_k: 1

scenario:
  hva_region_fraction: 0.25          # HVAs placed within +-fraction of world half-extent in x,y
  drone_ring_radius: [300.0, 1500.0] # drones spawn around HVA centroid, radius range (m)
  drone_altitude_range: [100.0, 800.0]
  missile_altitude_range: [1500.0, 3000.0]
  missile_speed_fraction: [0.7, 0.95] # initial speed as fraction of missile max_speed
  patterns: [saturation, pincer, wave]
  wave_interval_s: 2.0               # spawn_time stagger between waves
  num_waves: 3
  hva_impact_radius: 50.0
  mode: "3d"                         # "3d" or "2d" (2d => every z = 0 and no vertical motion)
  weave_enabled: true


estimation:
  enable_sensor_noise: true
  position_noise_std_meters: 15.0
  scout_noise_multiplier: 0.4          # Scouts broadcast cleaner tracks than interceptors
  range_noise_scale: 0.5               # Noise grows with (dist / sensor_range)
  use_kalman_filter: true
  kf_process_accel_std: 35.0           # Process noise sigma_a (m/s^2) for maneuvering targets
  kf_init_pos_var: 225.0               # Initial position variance (m^2)
  kf_init_vel_var: 10000.0             # Initial velocity variance ((m/s)^2)
  kf_init_acc_var: 2500.0              # Initial acceleration variance ((m/s^2)^2)

guidance:
  base_guidance: true_proportional_navigation
  navigation_gain_N: 4.0
  allocator: hybrid_auction_attention
  hysteresis_bonus: 2.5

guidance_and_allocation:
  base_guidance: true_proportional_navigation
  navigation_gain_N: 4.0
  v_min_closing: 20.0
  tgo_cap: 120.0
  cbf_gain: 500.0
  cost_weights: {w_tgo: 1.0, w_zem: 0.02, w_urgency: 50.0, w_hysteresis: 2.5, w_logit: 1.0}
  auction_num_iters: 10
  auction_eps: 0.05
  invalid_cost: 1.0e6

rewards:
  intercept_assigned_bonus: 10.0
  intercept_team_bonus: 5.0
  hva_leaker_penalty: 15.0
  duplicate_penalty: 2.0
  collision_penalty: 10.0
  effort_weight: 0.01
  shaping_gamma: 0.99
  shaping_zem_weight: 1.0
  shaping_dist_weight: 0.5

curriculum:
  window_size: 50
  stage1: {num_interceptors: 6, num_scouts: 0, num_missiles: 8, mode: "2d", weave_enabled: false, decoy_fraction: 0.0, sigma_obs: 0.0, linear_drag: 0.0, win_threshold: 0.90}
  stage2: {num_interceptors: 12, num_scouts: 3, num_missiles: 25, mode: "3d", weave_enabled: true, decoy_fraction: 0.0, sigma_obs: 0.0, linear_drag: 0.02, win_threshold: 0.85}
  stage3: {num_interceptors: 16, num_scouts: 4, num_missiles: 30, mode: "3d", weave_enabled: true, decoy_fraction: 0.15, sigma_obs: 15.0, linear_drag: 0.015, win_threshold: 1.0}

training:
  algorithm: attention_mappo_ctde
  device: cuda
  mixed_precision_amp: true
  d_model: 64
  num_attention_heads: 2
  mlp_hidden_sizes: [64, 64]
  residual_accel_max_g: 4.0
  logit_scale: 5.0
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  entropy_coef: 0.01
  value_loss_coef: 0.5
  max_grad_norm: 0.5
  rollout_steps: 256
  ppo_epochs: 4
  num_minibatches: 4
  total_env_steps: 10000000
  eval_interval_updates: 25
  num_eval_seeds: 5

