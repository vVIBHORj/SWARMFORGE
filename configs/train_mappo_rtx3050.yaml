extends: default_sim.yaml

environment:
  num_parallel_envs: 16

training:
  algorithm: attention_mappo_ctde
  device: cuda
  mixed_precision_amp: true
  d_model: 64
  num_attention_heads: 2
  mlp_hidden_sizes: [64, 64]
  residual_accel_max_g: 4.0
  logit_scale: 5.0
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  entropy_coef: 0.01
  value_loss_coef: 0.5
  max_grad_norm: 0.5
  rollout_steps: 256
  ppo_epochs: 4
  num_minibatches: 4
  total_env_steps: 10000000
  eval_interval_updates: 25
  num_eval_seeds: 5

visualization:
  enabled_during_training: false
  websocket_port: 8765
  protocol: binary_float32
  target_fps: 60
